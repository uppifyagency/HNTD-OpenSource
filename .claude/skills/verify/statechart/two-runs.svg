  }
  .pele .bugPath rect {
    stroke: #116dd2 !important;
  }
  .pele .repeats rect {
    stroke: #9a3fcf !important;
  }
}
</style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="363.5" y="25.6">HNTD search: two pipeline runs on one search</tspan></text><g transform="translate(0,36)"><g class="pele-clusters"><g class="pele-cluster pele-state-composite" data-id="legend"><rect x="261.94" y="8" width="456.98" height="112" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M261.94,44H718.92" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="490.43" y="31.6" text-anchor="middle">Legend</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M214.94,120L214.94,157"/><path class="pele-marker" d="M214.94,164L211.58,156L218.3,156Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M214.94,208L214.94,270"/><path class="pele-marker" d="M214.94,277L211.58,269L218.3,269Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M214.94,321L214.94,398"/><path class="pele-marker" d="M214.94,405L211.58,397L218.3,397Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M120.03,467L120.03,529"/><path class="pele-marker" d="M120.03,536L116.67,528L123.39,528Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M309.85,467L309.85,529"/><path class="pele-marker" d="M309.85,536L306.49,528L313.21,528Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="155.3" y="228.5" width="119.27" height="21" rx="3" fill="var(--_bg)"/><text x="214.94" y="243.9" text-anchor="middle">you start a search</text></g><g class="pele-edge-label" data-id="edge2"><rect x="122.24" y="341.5" width="185.41" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserv